[package]
name = "unflub-engine"
description = "unflub's keyboard engine process: hook, engine, pill. No network code (CI checks)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The library is the IPC contract both processes share: messages, framing, the named pipe and
# the pill's theme colours. The binary is `unflub-engine.exe`, spawned by the tray app.
[lib]
name = "unflub_engine"
path = "src/lib.rs"

[[bin]]
name = "unflub-engine"
path = "src/main.rs"

# Nothing here may reach the network: tests/no_network.rs fails on any HTTP, TLS, Sentry or
# Tauri crate in this tree and on any Win32_Networking feature. Keep it that way.
[dependencies]
unflub-core = { workspace = true, features = ["serde"] }
unflub-windows.workspace = true
serde.workspace = true
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Unresolved frame addresses and loaded modules for the crash marker; the app turns it into a
# Sentry event (symbolicated on Sentry's side, like the app's own reports).
backtrace = "0.3"
findshlibs = "0.10"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
# Version info (company, copyright) and the icon, the same as unflub.exe's.
embed-resource = "3"
