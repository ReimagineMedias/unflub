[workspace]
resolver = "2"
members = ["crates/unflub-core", "crates/unflub-windows", "crates/unflub-engine", "app/src-tauri"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/ReimagineMedias/unflub"
rust-version = "1.85"

[workspace.dependencies]
unflub-core = { path = "crates/unflub-core" }
unflub-windows = { path = "crates/unflub-windows" }
unflub-engine = { path = "crates/unflub-engine" }
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
