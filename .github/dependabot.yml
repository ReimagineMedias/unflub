# Keeps the SHA-pinned workflow actions current (Dependabot updates the SHA and its
# version comment together), plus the Rust and npm dependencies. See docs/releasing.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directories:
      - /app
      - /site
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
