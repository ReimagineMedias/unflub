name: Publish packages

# For each published (not draft, not pre-release) release: checks the release is public with
# both setups, writes the winget, Scoop and Chocolatey files with the release's real SHA-256
# values (artifact `package-manifests`, from scripts/package-manifests.mjs), and, once enabled,
# opens a winget-pkgs pull request. The pull request is off until the repository variable
# PUBLISH_PACKAGES is 'true' (Settings > Secrets and variables > Actions > Variables); it needs
# the WINGET_TOKEN secret and a fork of microsoft/winget-pkgs, and RMGN.unflub must already be
# in winget (the first version is submitted by hand). The Scoop bucket's own checkver job bumps
# Scoop; Chocolatey is pushed by hand from the artifact. See docs/releasing.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish again, like v0.2.0
        required: true

permissions:
  contents: read

jobs:
  manifests:
    name: Package files with real hashes
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Require a public stable release with both setups
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets > release.json
          if ! jq -e '(.isDraft == false) and (.isPrerelease == false) and
            ([.assets[].name | select(test("_(x64|arm64)-setup\\.exe$"))] | length == 2) and
            ([.assets[].name | select(. == "SHA256SUMS.txt")] | length == 1)' release.json > /dev/null; then
            echo "::error::$TAG must be a published, stable release with both setups and SHA256SUMS.txt."
            exit 1
          fi

      - name: Write the package files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt
          node scripts/package-manifests.mjs --version "${TAG#v}" --sums SHA256SUMS.txt --out package-manifests

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-manifests
          path: package-manifests/

  winget:
    name: winget (RMGN.unflub)
    needs: manifests
    if: vars.PUBLISH_PACKAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Open the winget-pkgs pull request
        id: winget
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: RMGN.unflub
          # The per-user setup.exe for each architecture. The MSI is for managed deployment.
          installers-regex: '_(x64|arm64)-setup\.exe$'
          release-tag: ${{ inputs.tag || github.event.release.tag_name }}
          fork-user: ${{ vars.WINGET_FORK_USER || github.repository_owner }}
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Summary
        if: always()
        env:
          PR_URL: ${{ steps.winget.outputs.pr-url }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          {
            echo "| Package | Release | Result |"
            echo "|---|---|---|"
            echo "| winget \`RMGN.unflub\` | \`$TAG\` | ${PR_URL:-❌ no pull request} |"
          } >> "$GITHUB_STEP_SUMMARY"
