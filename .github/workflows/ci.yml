name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Settings UI (typecheck, build)
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "| Check | ${{ matrix.os }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| fmt, clippy, test | ${{ job.status == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"

  perf:
    name: Perf (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        id: build
        run: |
          cargo build --release -p unflub-core --example bench
          if ($IsWindows) { cargo build --release -p unflub-windows --bin unflub --example jobrun }
          New-Item -ItemType Directory -Force .local/perf | Out-Null
      - name: Core bench
        if: steps.build.outcome == 'success'
        run: |
          ./target/release/examples/bench --json --check perf/limits.toml | Tee-Object .local/perf/bench.json
          exit $LASTEXITCODE
      - name: Idle footprint (dry-run hook, no input sent)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Windows' }}
        run: |
          ./perf/idle.ps1 | Tee-Object .local/perf/idle.json
          exit $LASTEXITCODE
      - name: Low-end simulation (25% of one core, 1 core, 128 MB)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Windows' }}
        run: |
          ./perf/lowend.ps1 | Tee-Object .local/perf/lowend.json
          exit $LASTEXITCODE
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          $files = @('.local/perf/bench.json')
          if ($IsWindows) { $files += '.local/perf/idle.json', '.local/perf/lowend.json' }
          ./perf/summary.ps1 -Path $files -Title 'Perf (${{ matrix.os }})'
