name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Settings UI (typecheck, build)
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The part of unflub that sees your keys has no network code: no HTTP, TLS, Sentry or Tauri
      # crate in unflub-engine's tree (every target) and no Win32_Networking feature.
      - name: No network code in the engine
        id: offline
        if: ${{ !cancelled() }}
        run: cargo test -p unflub-engine --test no_network -- --nocapture
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "| Check | ${{ matrix.os }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| fmt, clippy, test | ${{ job.status == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| No network code in unflub-engine | ${{ steps.offline.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"

  perf:
    name: Perf (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: runner.os == 'Windows'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build release
        id: build
        run: |
          cargo build --release -p unflub-core --example bench --example quality
          if ($IsWindows) {
            # The app embeds the settings UI, so build that first. Plain cargo leaves the Tauri
            # sidecar out (app/src-tauri/build.rs); the engine lands beside unflub.exe anyway.
            Push-Location app; npm ci; npm run build; Pop-Location
            cargo build --release -p unflub-app -p unflub-engine
            cargo build --release -p unflub-windows --bin unflub-cli --example jobrun
          }
          New-Item -ItemType Directory -Force .local/perf | Out-Null
      - name: Core bench
        if: steps.build.outcome == 'success'
        run: |
          ./target/release/examples/bench --json --check perf/limits.toml | Tee-Object .local/perf/bench.json
          exit $LASTEXITCODE
      - name: Autocorrect quality (false fixes on clean text, typo recovery)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          ./target/release/examples/quality --json --check perf/limits.toml | Tee-Object .local/perf/quality.json
          exit $LASTEXITCODE
      - name: Idle footprint, app and engine (dry-run hook, no input sent)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Windows' }}
        run: |
          ./perf/idle.ps1 | Tee-Object .local/perf/idle.json
          exit $LASTEXITCODE
      - name: Low-end simulation (25% of one core, 1 core, 128 MB)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Windows' }}
        run: |
          ./perf/lowend.ps1 | Tee-Object .local/perf/lowend.json
          exit $LASTEXITCODE
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          $files = @('.local/perf/bench.json', '.local/perf/quality.json')
          if ($IsWindows) { $files += '.local/perf/idle.json', '.local/perf/lowend.json' }
          ./perf/summary.ps1 -Path $files -Title 'Perf (${{ matrix.os }})'
